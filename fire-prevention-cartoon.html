const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const frac = v => v - Math.floor(v);
const smooth = (a, b, v) => { const u = clamp((v - a) / (b - a)); return u * u * (3 - 2 * u); };
const bump = u => (u <= 0 || u >= 1) ? 0 : Math.sin(Math.PI * u);
const arcH = u => (u <= 0 || u >= 1) ? 0 : 4 * u * (1 - u);
const hash = n => frac(Math.sin(n * 127.1 + 311.7) * 43758.5453);   // 결정적 난수(같은 n → 같은 값)

const EASE = {
  lin: u => u,
  sine: u => 0.5 - 0.5 * Math.cos(Math.PI * u),
  inOut: u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  out: u => 1 - Math.pow(1 - u, 3),
  in: u => u * u * u,
  accel: u => 1 - Math.pow(1 - Math.pow(u, 2.5), 2),                      // 느리게 출발 → 빨라짐 → 부드럽게 멈춤
  bounce: u => u < 0.72 ? 1.04 * EASE.inOut(u / 0.72) : 1.04 - 0.04 * EASE.out((u - 0.72) / 0.28),   // 4% 지나쳤다 톡
};
const CAM_EASE = { '시작': EASE.sine, '천천히': EASE.sine, '가속': EASE.accel, '통통': EASE.bounce, '확 줌인': EASE.out };

// 등장: 0 → 1.15 → 1.0 (0.35초)
function popS(u) {
  if (u <= 0) return 0;
  if (u >= 1) return 1;
  return u < 0.55 ? 1.15 * EASE.out(u / 0.55) : 1.15 - 0.15 * EASE.sine((u - 0.55) / 0.45);
}

// 닿음: 가로 1.25·세로 0.8 → 0.92·1.08 → 제자리 (0.3초)

  if (u <= 0 || u >= 1) return [1, 1];
  if (u < 0.45) { const e = EASE.sine(u / 0.45); return [lerp(1.25, 0.92, e), lerp(0.8, 1.08, e)]; }
  const e = EASE.sine((u - 0.45) / 0.55); return [lerp(0.92, 1, e), lerp(1.08, 1, e)];
}

function shade(h) {                                    // 같은 색 20% 어둡게

function rrP(x, y, w, h, r) {
  const p = new Path2D(); r = Math.min(r, w / 2, h / 2);
  p.moveTo(x + r, y); p.arcTo(x + w, y, x + w, y + h, r); p.arcTo(x + w, y + h, x, y + h, r);
  p.arcTo(x, y + h, x, y, r); p.arcTo(x, y, x + w, y, r); p.closePath();
  return p;
}
function circP(x, y, r) { const p = new Path2D(); p.arc(x, y, r, 0, TAU); return p; }
function ellP(x, y, rx, ry) { const p = new Path2D(); p.ellipse(x, y, rx, ry, 0, 0, TAU); return p; }

/* =====================================================================
   7. 장면 ② 문어발 콘센트 금지
   ===================================================================== */
const TAP_PLUGS = [                                       // 멀티탭·꽂힌 플러그 여섯 (마지막 하나만 남음)
  { on: 'B', x: 590, dx: -70, h: 120, pull: 0 }, { on: 'B', x: 630, dx: -10, h: 150, pull: 1 }, { on: 'B', x: 670, dx: 50, h: 130, pull: 2 },
  { on: 'A', x: 745, chain: true, pull: 3 }, { on: 'A', x: 835, dx: 70, h: 120, pull: 4 }, { on: 'A', x: 790, dx: 20, h: 150, keep: true },

const pullT = k => TL.unplug + k * TL.unplugGap;

function sceneTap() {

  });

    popIn(t0 + 0.3, bx, fl, () => { rr(bx - bw / 2, fl - 30, bw, 30, 12, C.white, { lw: 5 }); });
    if (popAt(t0 + 0.3) > 0) cord(bez([bx + bw / 2 - 6, fl - 15], [720, fl - 8], [745, fl - 46]), 3, shake);
  });
  popIn(t0 + 0.15, ax, fl, () => { rr(ax - aw / 2, fl - 30, aw, 30, 12, C.white, { lw: 5 }); });
  TAP_PLUGS.forEach((pl, k) => {
    const tp = t0 + 0.35 + k * 0.045, gone = pl.keep ? 0 : prog(T, pullT(pl.pull), pullT(pl.pull) + 0.15);
    if (gone >= 1 || (pl.on === 'B' && chainGone >= 1)) return;
    const s = popAt(tp);
    if (s <= 0) return;

    withTf(pl.x, fl - 30 + lift, sc, sc, 0, () => {
      if (!pl.chain) {
        const wig = Math.sin(T * 3 + k) * 8;              // 문어 다리처럼 늘어진 전선
        const tip = [pl.dx, -pl.h], c1 = [pl.dx * 0.1 + wig, -pl.h * 0.75];

  TAP_PLUGS.filter(p => !p.keep).sort((a, b) => a.pull - b.pull).forEach(p => keys.push([pullT(p.pull), p.chain ? 745 : p.x, fl - 70]));

    rr(hx + 14, hy - 74, 52, 30, 10, C.white, { lw: 5, sh: 4 });
    circ(hx, hy - 30, 26, C.white, { lw: 5 });

  }
}

/* =====================================================================
   8. 장면 ③ 기름걸레는 뚜껑 통에
   ===================================================================== */
const RAGS = [[400, 18, 150, 34], [393, 46, 136, 30], [408, 72, 126, 30], [400, 97, 110, 28]];   // x, 바닥 위 높이, 폭, 두께

  const pts = [];
  for (let i = 0; i < 12; i++) { const a = TAU * i / 12; pts.push([cx + Math.cos(a) * w / 2 * (1 + 0.08 * Math.sin(i * 2.3 + k)), cy + Math.sin(a) * h / 2 * (1 + 0.18 * Math.cos(i * 1.7 + k))]); }
  smoothBlob(pts, C.white, { lw: 5 });

  ctx.beginPath(); ctx.ellipse(cx - w * 0.18, cy + 2, w * 0.12, h * 0.22, 0.3, 0, TAU); ctx.ellipse(cx + w * 0.2, cy - 3, w * 0.07, h * 0.16, -0.4, 0, TAU); ctx.fill();
}
function sceneRags() {
  const fl = floorOf(2), [cx] = POS.can3, t0 = TL.rags;
  if (T < t0) return;
  // 뚜껑 달린 파랑 금속통
  const lidA = 1.35 * (1 - EASE.in(prog(T, TL.lidClose[0], TL.lidClose[1])));
  const [csx, csy] = landSq((T - TL.lidClose[1]) / 0.3);
  popIn(TL.can3, cx, fl, () => withTf(cx, fl, csx, csy, 0, () => { ctx.translate(-cx, -fl);
    rr(cx - 60, fl - 158, 120, 158, 14, C.blue);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - 60, fl - 110); ctx.lineTo(cx + 60, fl - 110); ctx.moveTo(cx - 60, fl - 52); ctx.lineTo(cx + 60, fl - 52); ctx.stroke();
    withTf(cx + 66, fl - 160, 1, 1, lidA, () => { rr(-136, -18, 136, 18, 8, C.blue, { lw: 5, sh: 4 }); caps(-74, -20, -62, -20, 6, C.ink, { lw: 0, sh: 0 }); });
  }));
  // 걸레 더미: 풀썩 쌓이고 → 한 장씩 통으로 쏙쏙

/* =====================================================================
   9. 장면 ④ 인화물질은 밀폐 보관

function sceneThinner(st) {

  POS.thinner.forEach((x, k) => popIn(TL.thinner[k], x, fl, () => thinnerCan(lerp(x, [862, 938][k], slide), fl, capU, k)));

/* =====================================================================
   10. 장면 ⑤ 소화기 앞은 비우기
   ===================================================================== */
function drawExt(x, y, o = {}) {                         // 빨강 소화기 (x, y = 몸통 가운데)

  rr(x - 35, y - 70, 70, 160, 28, C.red);

const PUSH_ORDER = [1, 0, 3, 2];                          // 위오른쪽 → 아래오른쪽 → 위왼쪽 → 아래왼쪽

      rr(-55, -115, 110, 115, 8, C.white);

    }));

}

    w: 46, draw: (px, py) => {
      const hop = TL.pinHops.reduce((s, h) => s + 14 * arcH(prog(T, h, h + 0.28)), 0);
      const [sx, sy] = TL.pinHops.reduce((a, h) => { const q = landSq((T - h - 0.28) / 0.3); return [a[0] * q[0], a[1] * q[1]]; }, [1, 1]);
      popIn(TL.pin, px, py + 22, () => withTf(px, py + 22 - hop, sx, sy, 0, () => pinShape(0, -22, 1)));
    },
  });
  // 전파 곡선 세 줄, 1초에 3번
  const [w0, w1] = TL.waves;
  if (T > w0 && T < w1) {
    const ph = frac((T - w0) * 3), [cx, cy] = [x + 60, fl - 200];
    ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let k = 0; k < 3; k++) {
      ctx.save(); ctx.globalAlpha = 1 - ph; ctx.beginPath(); ctx.arc(cx, cy, 20 + 16 * k + 18 * ph, -0.75, 0.75); ctx.stroke(); ctx.restore();
    }
  }
}

/* =====================================================================
   13. 장면 ⑧ 작은 불은 소화기로
   ===================================================================== */
function sprayGeo() {
  const fl = floorOf(7), [w0, w1] = TL.extWorker, [xs, xe] = POS.sprayer, s = WORKER_SCALE;
  const wx = lerp(xs, xe, EASE.out(prog(T, w0, w1 - 0.1)));
  const sweep = T > TL.spray[0] && T < TL.spray[1] ? 0.16 * Math.sin((T - TL.spray[0]) / (TL.spray[1] - TL.spray[0]) * TAU * 2) : 0;
  const nozL = [104, -116], N = [wx + nozL[0] * s, fl + nozL[1] * s];
  const root = [POS.sprayer[1] + 155, fl - 14];
  const aim = Math.atan2(root[1] - N[1], root[0] - N[0]) + sweep;
  return { fl, wx, N, aim, root, nozL };
}
function sceneSpray() {
  const [w0, w1] = TL.extWorker;
  if (T < w0) return;
  const g = sprayGeo(), [pp0] = TL.pinPull, pulled = T >= pp0, squeeze = T > TL.spray[0] - 0.08 && T < TL.spray[1] ? 1 : 0;
  popIn(w0, g.wx, g.fl, () => drawWorker(g.wx, g.fl, {
    ph: 3.1, walk: T < w1 ? (T - w0) * 26 : 0, L: [16, -96], R: [92, -122], mouth: 'line',
    item: () => {
      withTf(30, -98, 0.78, 0.78, 0, () => drawExt(0, 0, { hose: false, lever: -0.35 * squeeze, pin: !pulled }));
      inkLine(bez([36, -170], [86, -168], [g.nozL[0] - 10, g.nozL[1]]), C.ink, 9, { ow: 0 });
      const a = g.aim, n0 = g.nozL;
      caps(n0[0] - Math.cos(a) * 16, n0[1] - Math.sin(a) * 16, n0[0] + Math.cos(a) * 10, n0[1] + Math.sin(a) * 10, 7, C.ink, { lw: 0, sh: 0 });
    },
  }));
  // 안전핀이 쏙 뽑혀 포물선으로
  const u = prog(T, pp0, TL.pinPull[1]);
  if (u > 0 && u < 1) {
    const s = WORKER_SCALE, px = g.wx + (30 + 15 * 0.78) * s - 160 * u, py = g.fl + (-98 - 84 * 0.78) * s - 120 * arcH(Math.min(1, u * 1.6)) + 260 * u * u;
    withTf(px, py, 1, 1, u * 9, () => { circ(0, 0, 8, C.yellow, { lw: 4, sh: 0, hl: false }); caps(8, 0, 30, 0, 3, C.ink, { lw: 0, sh: 0 }); });
  }
  // 잉크 점선 조준선
  if (T > TL.pinPull[0] + 0.3 && T < TL.spray[0] + 0.1) {
    const k = EASE.out(prog(T, TL.pinPull[0] + 0.3, TL.pinPull[1]));
    ctx.setLineDash([10, 12]); ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.lineCap = 'round';
    strokePts([g.N, [lerp(g.N[0], g.root[0], k), lerp(g.N[1], g.root[1], k)]]);
    ctx.setLineDash([]);
  }
}
function sceneSprayFront() {                             // 흰 분말: 원 60개가 부채꼴로 커지며 옅어짐
  const [s0, s1] = TL.spray;
  if (T < s0 || T > s1 + 0.6) return;
  const g = sprayGeo(), life = 0.55;
  for (let k = 0; k < 60; k++) {
    const age = frac((T - s0) / life + k / 60) * life, birth = T - age;
    if (birth < s0 || birth > s1) continue;
    const a = g.aim + (hash(k + 11) - 0.5) * 0.6, d = age * (420 + 120 * hash(k + 5)), r = 6 + 30 * (age / life);
    ctx.save(); ctx.globalAlpha = 1 - age / life;
    circ(g.N[0] + Math.cos(a) * d, g.N[1] + Math.sin(a) * d, r, C.white, { lw: 3, sh: 0, hl: false });
    ctx.restore();
  }
}
function drawPoof(st) {                                  // 퐁!
  const u = prog(T, TL.poof, TL.poof + 0.25);
  if (u <= 0 || u >= 1) return;
  for (let i = 0; i < 8; i++) {
    const a = i * TAU / 8, r0 = 50 + 40 * u;
    inkLine([[st.x + Math.cos(a) * r0, st.y + Math.sin(a) * r0], [st.x + Math.cos(a) * (r0 + 22 * (1 - u)), st.y + Math.sin(a) * (r0 + 22 * (1 - u))]], null, 0, { ow: 3 });
  }
}

/* =====================================================================
   14. 장면 ⑨ 연기엔 낮은 자세로 · ⑩ 모두 안전!
   ===================================================================== */
const PUFFS = [[230, 8040, 58], [340, 8098, 50], [580, 8044, 60], [690, 8092, 52], [250, 8128, 46], [625, 8130, 46]];
function doorOpen() {
  const o1 = smooth(42.8, 42.92, T) * (1 - smooth(43.25, 43.4, T)), o2 = smooth(44.18, 44.28, T) * (1 - smooth(44.95, 45.1, T));
  return Math.max(o1, o2);
}
function sceneHall(st) {
  const Hh = POS.hall, [h0] = TL.hall, fl = Hh.floor;
  if (T < h0) return;
  const dl = EASE.out(prog(T, h0, h0 + 0.35));
  inkLine([[Hh.x0, Hh.ceil], [lerp(Hh.x0, Hh.x1, dl), Hh.ceil]], C.ink, 8, { ow: 0 });
  inkLine([[Hh.x0, fl], [lerp(Hh.x0, Hh.x1, dl), fl]], C.ink, 8, { ow: 0 });
  inkLine([[800, fl], [lerp(800, 1110, dl), fl]], C.ink, 6, { ow: 0 });   // 문 바깥 마당
  // 엘리베이터 + 빨강 가위표
  const [lx] = POS.lift;
  popIn(h0 + 0.2, lx, fl, () => {
    rr(lx - 70, fl - 290, 140, 290, 8, C.white);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(lx, fl - 280); ctx.lineTo(lx, fl); ctx.stroke();
    rr(lx + 78, fl - 170, 14, 30, 5, C.white, { lw: 4, sh: 0, hl: false });
  });
  const [x0, x1] = TL.xMark, a1 = EASE.out(prog(T, x0, x0 + 0.2)), a2 = EASE.out(prog(T, x0 + 0.2, x1));
  if (a1 > 0) inkLine([[lx - 58, fl - 270], [lerp(lx - 58, lx + 58, a1), lerp(fl - 270, fl - 20, a1)]], C.red, 14, { ow: 4 });
  if (a2 > 0) inkLine([[lx + 58, fl - 270], [lerp(lx + 58, lx - 58, a2), lerp(fl - 270, fl - 20, a2)]], C.red, 14, { ow: 4 });
  // 비상구 문 + 초록 비상구 표시
  const [dx] = POS.exitDoor, od = doorOpen();
  popIn(h0 + 0.3, dx, fl, () => {
    if (od > 0) rr(dx - 50, fl - 280, 100, 280, 10, C.ink, { lw: 6, sh: 0, hl: false });
    const pw = 100 * (1 - od * 0.82), px = dx + 50 - pw;
    rr(od > 0 ? dx + 50 - 18 * od : px, fl - 280, Math.max(18, pw), 280, 10, C.white);
    if (od < 0.3) circ(px + 18, fl - 140, 7, C.ink, { lw: 0, sh: 0, hl: false });
  });
  const [sx, sy] = POS.exitSign, flash = bump(prog(T, 42.95, 43.2)) + bump(prog(T, 43.22, 43.47));
  popIn(h0 + 0.4, sx, sy, () => withTf(sx, sy, 1 + 0.12 * flash, 1 + 0.12 * flash, 0, () => {
    rr(-66, -29, 132, 58, 10, C.green);
    ctx.strokeStyle = C.white; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.arc(-14, -15, 6, 0, TAU); ctx.fillStyle = C.white; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-18, -4); ctx.lineTo(-24, 10); ctx.lineTo(-34, 18); ctx.moveTo(-24, 10); ctx.lineTo(-12, 16); ctx.lineTo(-8, 24);
    ctx.moveTo(-30, 0); ctx.lineTo(-18, -4); ctx.lineTo(-6, 4); ctx.moveTo(14, -18); ctx.lineTo(40, -18); ctx.lineTo(40, 20); ctx.lineTo(14, 20); ctx.stroke();
    if (flash > 0.2) { ctx.strokeStyle = C.yellow; ctx.lineWidth = 6; for (const a of [-2.5, -0.6]) { ctx.beginPath(); ctx.moveTo(Math.cos(a) * 82, Math.sin(a) * 40); ctx.lineTo(Math.cos(a) * 100, Math.sin(a) * 50); ctx.stroke(); } }
  }));
  // 연기 구름이 천장을 따라 여러 덩이로 갈라져 위쪽 절반을 덮음
  const [s0, s1] = TL.split, [g0, g1] = TL.smokeGone;
  if (T > s0 && T < g1) {
    const fade = 1 - smooth(g0, g1 - 0.2, T);
    PUFFS.forEach(([px, py, r], i) => {
      const u = EASE.out(prog(T, s0 + i * 0.08, s0 + 0.45 + i * 0.08));
      if (u <= 0) return;
      const [mx, my] = ROUTES[20].pts[6];
      ctx.save(); ctx.globalAlpha = fade;
      withTf(lerp(mx, px, u), lerp(my, py, u) + breath(T, i * 0.4) * 0.5, lerp(0.3, 1, u) * popS(Math.min(1, u * 1.4)), lerp(0.3, 1, u), 0, () => poly(cloudPts(r, i + T * 0.6), C.smoke));
      ctx.restore();
    });
  }
  // 작업자: 수건으로 코와 입을 막고 허리 숙여 종종걸음
  const [e0, e1] = TL.evac, [x0e, x1e] = [330, 745];
  if (T >= e0 - 0.3 && T < TL.exit[0] + 0.3) {
    const u = prog(T, e0, e1), ex = lerp(x0e, x1e, u) + 45 * EASE.in(prog(T, TL.exit[0], TL.exit[0] + 0.25));
    const gone = 1 - EASE.in(prog(T, TL.exit[0] + 0.05, TL.exit[0] + 0.25)), step = (T - e0) * TAU * 2.5;
    if (gone > 0) popIn(e0 - 0.3, ex, fl, () => withTf(ex, fl - (T > e0 && T < e1 ? 3 * Math.abs(Math.sin(step)) : 0), gone, gone, 0, () =>
      drawWorker(0, 0, { ph: 4.2, crouch: 34, lean: 0.55, walk: T > e0 && T < e1 ? step : 0, towel: true, L: [26, -194], R: [74, -64], still: false })));
  }
}
function sceneYard() {
  const fl = POS.hall.floor, [fx] = POS.flag, [f0, f1] = TL.flag;
  if (T < f0) return;
  const drop = EASE.in(prog(T, f0, f0 + 0.18)), [qx, qy] = landAt(f0 + 0.18), top = fl - 340;
  withTf(fx, fl - (1 - drop) * 300, qx, qy, 0, () => {   // 초록 집결지 깃발: 톡 꽂혀 펄럭
    ctx.translate(-fx, -fl);
    caps(fx, fl - 4, fx, top, 6, C.white, { lw: 5, sh: 0 });
    const cloth = [];
    for (let i = 0; i <= 10; i++) { const u = i / 10; cloth.push([fx + 6 + u * 116, top + 4 + 9 * Math.sin(u * 5 - T * 9) * u]); }
    for (let i = 10; i >= 0; i--) { const u = i / 10; cloth.push([fx + 6 + u * 116, top + 70 - u * 8 + 9 * Math.sin(u * 5 - T * 9 + 0.6) * u]); }
    poly(cloth, C.green, { lw: 5 });
  });
  // 작업자 셋: 문에서 0.2초 간격으로 튀어나와 줄지어 섬 → 인원 확인 → 만세 두 번 → 손 흔들기
  const [c0, c1] = TL.count, cheer = T > 45.85 && T < c1 ? Math.abs(Math.sin(Math.PI * 2 * (T - 45.85) / 0.35)) : 0;
  const wv = T > TL.wave[0] && T < TL.wave[1] ? Math.sin((T - TL.wave[0]) / (TL.wave[1] - TL.wave[0]) * TAU * 2) : null;
  TL.crew.forEach((tk, k) => {
    if (T < tk) return;
    const tx = POS.crew[2 - k], u = prog(T, tk, tk + 0.35), [qx2, qy2] = landAt(tk + 0.35);
    const x = lerp(POS.exitDoor[0], tx, EASE.out(u)), y = fl - 120 * arcH(u);
    const lead = tx === POS.crew[0];
    let L = [-58, -78], R = [58, -78];
    if (lead && T > c0 && T < 45.85) R = T < 45.62 ? [86, -170] : [92, -150];
    if (cheer > 0) { L = [-62, -160 - 90 * cheer]; R = [62, -160 - 90 * cheer]; }
    if (wv !== null) R = [70 + 18 * wv, -250];
    drawWorker(x, y, { s: 0.85, sx: qx2, sy: qy2, ph: k * 0.7 + 5, mouth: T > c0 ? 'open' : 'smile', L, R });
  });
  for (const [ts, ix] of [[45.45, 1], [45.68, 2]]) {     // 가리킬 때마다 머리 위 노랑 반짝
    const s = popAt(ts) * (1 - smooth(ts + 0.45, ts + 0.6, T));
    if (s > 0) withTf(POS.crew[ix], fl - 300, s, s, T * 3, () => poly(starPts(0, 0, 18, 0).map(([a, b], i) => i % 2 ? [a * 0.7, b * 0.7] : [a, b]), C.yellow, { lw: 4, sh: 0, hl: false }));
  }
}
function sceneEnd() {
  const e = TEXT.endTitle, s = TEXT.sign;
  popText(e.str, e.x, e.y, e.size, e.t, { font: e.font, hot: e.hot });
  popText(s.str, s.x, s.y, s.size, s.t, { font: s.font });
}

/* =====================================================================
   15. render(t) — 시간 t 하나로 한 장면 전체를 계산
   ===================================================================== */
function render(t) {
  T = ((t % DURATION) + DURATION) % DURATION;
  const cam = camAt(T);
  CAM = cam;
  VIEW = { x0: cam.x - W / 2 / cam.z, x1: cam.x + W / 2 / cam.z, y0: cam.y - H / 2 / cam.z, y1: cam.y + H / 2 / cam.z };

  // 통통 넘어가는 순간에만 모션 블러 (카메라 화면 속도로 계산)
  let blur = 0, ux = 0, uy = 0;
  if (cam.mode === '통통' && cam.moving) {
    const p = camAt(Math.max(0, T - 1 / 60));
    const dx = (cam.x - p.x) * cam.z, dy = (cam.y - p.y) * cam.z, d = Math.hypot(dx, dy);
    if (d > 1.5) { blur = Math.min(48, d * 0.8); ux = dx / d; uy = dy / d; }
  }
  ctx = blur > 0 ? bctx : mctx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.fillStyle = C.wall; ctx.fillRect(0, 0, W, H);
  drawParallax(cam);
  ctx.setTransform(cam.z, 0, 0, cam.z, W / 2 - cam.x * cam.z, H / 2 - cam.y * cam.z);
  drawWall();
  drawPlatforms();
  drawRoutes();

  const st = heroState(T);
  if (inView(380, 760)) sceneTitle();
  if (inView(1000, 1420)) sceneWeld();
  if (inView(1880, 2290)) sceneTap();
  if (inView(2700, 3160)) sceneRags();
  if (inView(3560, 4030)) sceneThinner(st);
  if (inView(4500, 4900)) sceneExt();
  if (inView(5140, 5260)) sceneQuestion();
  if (inView(5250, 5770)) sceneAlarm();
  if (inView(6150, 6640)) sceneCall();
  if (inView(7100, 7510)) sceneSpray();
  if (inView(7900, 8420)) { sceneHall(st); sceneYard(); }
  sceneLabels();
  drawHero(st);
  drawPoof(st);
  if (inView(7100, 7700)) sceneSprayFront();
  sceneChecks();
  if (inView(8950, 9180)) sceneEnd();

  // 합성
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.globalAlpha = 1;
  if (blur > 0) {
    const n = 6;
    mctx.fillStyle = C.wall; mctx.fillRect(0, 0, W, H);
    for (let i = 0; i < n; i++) {
      const o = (i / (n - 1) - 0.5) * blur;
      mctx.globalAlpha = 1 / (i + 1);
      mctx.drawImage(buf, ux * o, uy * o);
    }
    mctx.globalAlpha = 1;
  }
  mctx.drawImage(vig, 0, 0);
}

/* =====================================================================
   16. 재생 · 재생 위치 막대 · 화면 맞춤
   ===================================================================== */
const ui = { play: document.getElementById('play'), seek: document.getElementById('seek'), time: document.getElementById('time'), bar: document.getElementById('bar') };
const ICON_PLAY = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9.5-5.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 1.5h3.2v11H2.5zM8.3 1.5h3.2v11H8.3z"/></svg>';
let playing = true, now = 0, lastTs = 0, dirty = true, scrubbing = false;

function setPlaying(v) {
  playing = v; lastTs = 0;
  ui.play.innerHTML = v ? ICON_PAUSE : ICON_PLAY;
  ui.play.setAttribute('aria-label', v ? '일시정지' : '재생');
}
function seekTo(v) { now = clamp(v, 0, DURATION - 0.001); dirty = true; }
function fit() {
  const pad = 24, gap = 10, barH = 44;
  let h = window.innerHeight - barH - gap - pad, w = h * W / H;
  const maxW = window.innerWidth - 32;
  if (w > maxW) { w = maxW; h = w * H / W; }
  w = Math.max(80, w); h = Math.max(142, h);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  ui.bar.style.width = Math.min(maxW, Math.max(w, 280)) + 'px';
}
function tick(ts) {
  if (playing && !scrubbing) {
    if (lastTs) now = (now + Math.min(0.25, (ts - lastTs) / 1000)) % DURATION;
    lastTs = ts; dirty = true;
  } else lastTs = 0;
  if (dirty) {
    render(now);
    dirty = false;
    if (!scrubbing) ui.seek.value = now.toFixed(2);
    ui.time.textContent = `${now.toFixed(1)} / ${DURATION.toFixed(1)}`;
  }
  requestAnimationFrame(tick);
}
ui.play.addEventListener('click', () => setPlaying(!playing));
ui.seek.addEventListener('input', () => { scrubbing = true; seekTo(parseFloat(ui.seek.value)); });
ui.seek.addEventListener('change', () => { scrubbing = false; lastTs = 0; });
window.addEventListener('pointerup', () => { if (scrubbing) { scrubbing = false; lastTs = 0; } });
window.addEventListener('keydown', e => {
  if (e.target === ui.seek && e.key !== ' ') return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowRight') seekTo(now + 1);
  else if (e.key === 'ArrowLeft') seekTo(now - 1);
});
window.addEventListener('resize', fit);
// 글꼴은 재생을 막지 않고 뒤에서 불러옴 → 준비되면 글자 폭을 다시 잼
const ALL_TEXT = [...new Set(JSON.stringify(TEXT).replace(/[\x00-\x7F]/g, '') + '0123456789!?"·')].join('');
if (document.fonts && document.fonts.load) {
  document.fonts.addEventListener('loadingdone', () => { measureCache.clear(); dirty = true; });
  let tries = 0;
  const poll = setInterval(() => {
    if (fontReady || ++tries > 60) return clearInterval(poll);
    Promise.all([document.fonts.load('64px "Jua"', ALL_TEXT), document.fonts.load('64px "Black Han Sans"', ALL_TEXT)]).then(([a, b]) => {
      if (a.length && b.length && !fontReady) { fontReady = true; measureCache.clear(); dirty = true; }
    }).catch(() => {});
  }, 300);
}
window.render = render;                               // 콘솔에서 render(초) 로 확인 가능
setPlaying(true);
fit();
requestAnimationFrame(tick);
</script>
